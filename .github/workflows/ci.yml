name: CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'Reframer/Reframer/**'
      - 'Reframer/Reframer.xcodeproj/**'
      - 'Reframer/Reframer.xctestplan'
      - 'Reframer/ReframerTests/**'
      - 'Reframer/ReframerUITests/**'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'Reframer/Reframer/**'
      - 'Reframer/Reframer.xcodeproj/**'
      - 'Reframer/Reframer.xctestplan'
      - 'Reframer/ReframerTests/**'
      - 'Reframer/ReframerUITests/**'
      - 'scripts/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Build, analyze, and test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Validate repository contract
        run: scripts/validate_repository.sh

      - name: Build Debug
        run: |
          xcodebuild build \
            -project Reframer/Reframer.xcodeproj \
            -scheme Reframer \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/Reframer-Debug" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release
        run: |
          xcodebuild build \
            -project Reframer/Reframer.xcodeproj \
            -scheme Reframer \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/Reframer-Release" \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM=
          scripts/validate_bundle.sh \
            "$RUNNER_TEMP/Reframer-Release/Build/Products/Release/Reframer.app"

      - name: Static analysis
        run: |
          xcodebuild analyze \
            -project Reframer/Reframer.xcodeproj \
            -scheme Reframer \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/Reframer-Analyze" \
            CODE_SIGNING_ALLOWED=NO

      - name: Unit tests
        run: |
          scripts/runner_test.sh
        env:
          ARTIFACTS_BASE: ${{ runner.temp }}/reframer-test-artifacts
          RUN_ID: unit
          TEST_SCOPE: unit

      - name: Build documentation
        run: |
          xcodebuild docbuild \
            -project Reframer/Reframer.xcodeproj \
            -scheme Reframer \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/Reframer-Docs" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reframer-test-diagnostics
          path: ${{ runner.temp }}/reframer-test-artifacts
          if-no-files-found: ignore
          retention-days: 7
