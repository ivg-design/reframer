name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Build, analyze, and test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Validate repository contract
        run: scripts/validate_repository.sh

      - name: Build Debug
        run: |
          xcodebuild build \
            -project Reframer/Reframer.xcodeproj \
            -scheme Reframer \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/Reframer-Debug" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release
        run: |
          xcodebuild build \
            -project Reframer/Reframer.xcodeproj \
            -scheme Reframer \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/Reframer-Release" \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO
          scripts/validate_bundle.sh \
            "$RUNNER_TEMP/Reframer-Release/Build/Products/Release/Reframer.app"

      - name: Static analysis
        run: |
          xcodebuild analyze \
            -project Reframer/Reframer.xcodeproj \
            -scheme Reframer \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/Reframer-Analyze" \
            CODE_SIGNING_ALLOWED=NO

      - name: Unit tests
        run: |
          scripts/runner_test.sh
        env:
          ARTIFACTS_BASE: ${{ runner.temp }}/reframer-test-artifacts
          RUN_ID: unit
          TEST_SCOPE: unit

      - name: Build documentation
        run: |
          xcodebuild docbuild \
            -project Reframer/Reframer.xcodeproj \
            -scheme Reframer \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/Reframer-Docs" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reframer-test-diagnostics
          path: ${{ runner.temp }}/reframer-test-artifacts
          if-no-files-found: ignore
          retention-days: 7
