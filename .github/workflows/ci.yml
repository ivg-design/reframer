name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, analyze, and test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Validate repository contract
        run: scripts/validate_repository.sh

      - name: Build Debug
        run: |
          xcodebuild build \
            -project Reframer/Reframer.xcodeproj \
            -scheme Reframer \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/Reframer-Debug" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release
        run: |
          xcodebuild build \
            -project Reframer/Reframer.xcodeproj \
            -scheme Reframer \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/Reframer-Release" \
            CODE_SIGNING_ALLOWED=NO
          scripts/validate_bundle.sh \
            "$RUNNER_TEMP/Reframer-Release/Build/Products/Release/Reframer.app"

      - name: Static analysis
        run: |
          xcodebuild analyze \
            -project Reframer/Reframer.xcodeproj \
            -scheme Reframer \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/Reframer-Analyze" \
            CODE_SIGNING_ALLOWED=NO

      - name: Unit tests
        run: |
          scripts/runner_test.sh
        env:
          ARTIFACTS_BASE: ${{ runner.temp }}/reframer-test-artifacts
          RUN_ID: unit
          TEST_SCOPE: unit

      - name: Build documentation
        run: |
          xcodebuild docbuild \
            -project Reframer/Reframer.xcodeproj \
            -scheme Reframer \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/Reframer-Docs" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reframer-test-diagnostics
          path: ${{ runner.temp }}/reframer-test-artifacts
          if-no-files-found: ignore
          retention-days: 7
