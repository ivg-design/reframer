name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Project version to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  quality:
    name: Verify release source
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository
        run: scripts/validate_repository.sh

      - name: Build Debug
        run: |
          xcodebuild build \
            -project Reframer/Reframer.xcodeproj \
            -scheme Reframer \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/Reframer-Debug" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build and inspect unsigned Release
        run: |
          xcodebuild build \
            -project Reframer/Reframer.xcodeproj \
            -scheme Reframer \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/Reframer-Release" \
            CODE_SIGNING_ALLOWED=NO
          scripts/validate_bundle.sh \
            "$RUNNER_TEMP/Reframer-Release/Build/Products/Release/Reframer.app"

      - name: Static analysis
        run: |
          xcodebuild analyze \
            -project Reframer/Reframer.xcodeproj \
            -scheme Reframer \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/Reframer-Analyze" \
            CODE_SIGNING_ALLOWED=NO

      - name: Unit tests
        run: scripts/runner_test.sh
        env:
          ARTIFACTS_BASE: ${{ runner.temp }}/reframer-release-test-artifacts
          RUN_ID: unit
          TEST_SCOPE: unit

      - name: Build documentation
        run: |
          xcodebuild docbuild \
            -project Reframer/Reframer.xcodeproj \
            -scheme Reframer \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/Reframer-Docs" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload quality diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reframer-release-quality-diagnostics
          path: ${{ runner.temp }}/reframer-release-test-artifacts
          if-no-files-found: ignore
          retention-days: 14

  ui:
    name: Verify interactive macOS workflows
    needs: quality
    runs-on: [self-hosted, macOS, reframer-ui]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner preflight
        run: scripts/ui_test_preflight.sh
        env:
          REFRAMER_UI_RUNNER_AUTHORIZED: ${{ vars.REFRAMER_UI_RUNNER_AUTHORIZED }}

      - name: Run UI tests serially
        run: scripts/runner_test.sh
        env:
          ARTIFACTS_BASE: ${{ runner.temp }}/reframer-release-ui-artifacts
          REFRAMER_UI_RUNNER_AUTHORIZED: ${{ vars.REFRAMER_UI_RUNNER_AUTHORIZED }}
          RUN_ID: ui
          TEST_SCOPE: ui

      - name: Upload UI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reframer-release-ui-diagnostics
          path: ${{ runner.temp }}/reframer-release-ui-artifacts
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Sign, notarize, and package
    needs: [quality, ui]
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate repository
        run: scripts/validate_repository.sh

      - name: Install signing identity
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/reframer-signing.keychain-db"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          echo "RELEASE_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Configure notarization
        env:
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_$NOTARY_KEY_ID.p8"
          echo "$NOTARY_API_KEY_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          xcrun notarytool store-credentials reframer-ci \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$RELEASE_KEYCHAIN"

      - name: Package release
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          NOTARY_KEYCHAIN: ${{ env.RELEASE_KEYCHAIN }}
          NOTARY_PROFILE: reframer-ci
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          export RELEASE_VERSION
          scripts/package_release.sh

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reframer-macOS
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --generate-notes

      - name: Remove temporary keychain
        if: always()
        run: |
          if [ -n "${RELEASE_KEYCHAIN:-}" ] && [ -f "$RELEASE_KEYCHAIN" ]; then
            security delete-keychain "$RELEASE_KEYCHAIN"
          fi
