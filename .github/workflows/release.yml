name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Project version to package
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality:
    name: Verify release source
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release source
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          RELEASE_VERSION="${REQUESTED_VERSION#v}"
          PROJECT_VERSION="$(
            xcodebuild \
              -project Reframer/Reframer.xcodeproj \
              -scheme Reframer \
              -configuration Release \
              -showBuildSettings |
              awk '/ MARKETING_VERSION = / { print $3; exit }'
          )"
          if [ "$RELEASE_VERSION" != "$PROJECT_VERSION" ]; then
            echo "error: requested $RELEASE_VERSION but project is $PROJECT_VERSION" >&2
            exit 65
          fi
          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "error: checkout did not provide origin/main" >&2
            exit 65
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "error: release source is not on origin/main" >&2
            exit 65
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$PROJECT_VERSION" ]; then
              echo "error: release tag must be v$PROJECT_VERSION" >&2
              exit 65
            fi
            TAG_COMMIT="$(git rev-parse "$GITHUB_REF_NAME^{commit}")"
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "error: release tag does not resolve to the event commit" >&2
              exit 65
            fi
            python3 - "$PROJECT_VERSION" <<'PY'
          import datetime
          import pathlib
          import sys

          version = sys.argv[1]
          prefix = f"## [{version}] - "
          matching_headers = [
              line for line in pathlib.Path("CHANGELOG.md").read_text().splitlines()
              if line.startswith(prefix)
          ]
          if len(matching_headers) != 1:
              raise SystemExit(
                  f"error: changelog must contain exactly one {version} heading"
              )
          value = matching_headers[0][len(prefix):]
          if value == "Unreleased":
              raise SystemExit(
                  f"error: changelog entry for {version} is still Unreleased"
              )
          try:
              parsed = datetime.date.fromisoformat(value)
          except ValueError:
              raise SystemExit(
                  f"error: changelog entry for {version} is not dated"
              )
          if parsed.isoformat() != value:
              raise SystemExit(
                  f"error: changelog entry for {version} is not dated"
              )
          PY
          fi

      - name: Validate repository
        run: scripts/validate_repository.sh

      - name: Build Debug
        run: |
          xcodebuild build \
            -project Reframer/Reframer.xcodeproj \
            -scheme Reframer \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/Reframer-Debug" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build and inspect unsigned Release
        run: |
          xcodebuild build \
            -project Reframer/Reframer.xcodeproj \
            -scheme Reframer \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/Reframer-Release" \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO
          scripts/validate_bundle.sh \
            "$RUNNER_TEMP/Reframer-Release/Build/Products/Release/Reframer.app"

      - name: Static analysis
        run: |
          xcodebuild analyze \
            -project Reframer/Reframer.xcodeproj \
            -scheme Reframer \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/Reframer-Analyze" \
            CODE_SIGNING_ALLOWED=NO

      - name: Unit tests
        run: scripts/runner_test.sh
        env:
          ARTIFACTS_BASE: ${{ runner.temp }}/reframer-release-test-artifacts
          RUN_ID: unit
          TEST_SCOPE: unit

      - name: Build documentation
        run: |
          xcodebuild docbuild \
            -project Reframer/Reframer.xcodeproj \
            -scheme Reframer \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/Reframer-Docs" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload quality diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reframer-release-quality-diagnostics
          path: ${{ runner.temp }}/reframer-release-test-artifacts
          if-no-files-found: ignore
          retention-days: 14

  ui:
    name: Verify interactive macOS workflows
    needs: quality
    runs-on: [self-hosted, macOS, reframer-ui]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Runner preflight
        run: scripts/ui_test_preflight.sh
        env:
          REFRAMER_UI_RUNNER_AUTHORIZED: ${{ vars.REFRAMER_UI_RUNNER_AUTHORIZED }}

      - name: Run UI tests serially
        run: scripts/runner_test.sh
        env:
          ARTIFACTS_BASE: ${{ runner.temp }}/reframer-release-ui-artifacts
          REFRAMER_UI_RUNNER_AUTHORIZED: ${{ vars.REFRAMER_UI_RUNNER_AUTHORIZED }}
          RUN_ID: ui
          TEST_SCOPE: ui

      - name: Upload UI diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reframer-release-ui-diagnostics
          path: ${{ runner.temp }}/reframer-release-ui-artifacts
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Sign, notarize, and package
    needs: [quality, ui]
    runs-on: macos-15
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reverify release checkout
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "error: release checkout does not match the event commit" >&2
            exit 65
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "error: release checkout is not on origin/main" >&2
            exit 65
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] &&
             [ "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" != "$GITHUB_SHA" ]; then
            echo "error: release tag does not match the event commit" >&2
            exit 65
          fi

      - name: Validate repository
        run: scripts/validate_repository.sh

      - name: Install signing identity
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
        run: |
          umask 077
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/reframer-signing.keychain-db"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm -f "$CERTIFICATE_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          echo "RELEASE_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Configure notarization
        env:
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          umask 077
          NOTARY_KEY_PATH="$RUNNER_TEMP/reframer-notary-key.p8"
          printf '%s' "$NOTARY_API_KEY_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          xcrun notarytool store-credentials reframer-ci \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$RELEASE_KEYCHAIN"
          rm -f "$NOTARY_KEY_PATH"

      - name: Package release
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          NOTARY_KEYCHAIN: ${{ env.RELEASE_KEYCHAIN }}
          NOTARY_PROFILE: reframer-ci
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          export RELEASE_VERSION
          scripts/package_release.sh

      - name: Upload signed artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Reframer-macOS
          path: |
            dist/*.zip
            dist/*-notarization.json
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected_commit = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]

          def github_json(path):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          encoded_tag = urllib.parse.quote(tag, safe="")
          target = github_json(f"/git/ref/tags/{encoded_tag}")["object"]
          while target["type"] == "tag":
              target = github_json(f"/git/tags/{target['sha']}")["object"]
          if target["type"] != "commit" or target["sha"] != expected_commit:
              raise SystemExit(
                  "error: remote release tag no longer resolves to the event commit"
              )
          PY
          gh release create "$GITHUB_REF_NAME" \
            dist/*.zip \
            dist/*-notarization.json \
            dist/SHA256SUMS.txt \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --generate-notes

      - name: Remove temporary keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/reframer-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          NOTARY_KEY_PATH="$RUNNER_TEMP/reframer-notary-key.p8"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$CERTIFICATE_PATH" "$NOTARY_KEY_PATH"
