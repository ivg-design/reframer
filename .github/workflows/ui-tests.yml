name: UI Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [labeled, synchronize, reopened]

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui-tests:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'run-ui-tests')
      )
    name: Interactive macOS UI suite
    runs-on: [self-hosted, macOS, reframer-ui]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Runner preflight
        run: scripts/ui_test_preflight.sh
        env:
          REFRAMER_UI_RUNNER_AUTHORIZED: ${{ vars.REFRAMER_UI_RUNNER_AUTHORIZED }}

      - name: Run UI tests serially
        run: scripts/runner_test.sh
        env:
          ARTIFACTS_BASE: ${{ runner.temp }}/reframer-ui-test-artifacts
          REFRAMER_UI_RUNNER_AUTHORIZED: ${{ vars.REFRAMER_UI_RUNNER_AUTHORIZED }}
          RUN_ID: ui
          TEST_SCOPE: ui

      - name: Upload UI test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reframer-ui-test-diagnostics
          path: ${{ runner.temp }}/reframer-ui-test-artifacts
          if-no-files-found: ignore
          retention-days: 14
